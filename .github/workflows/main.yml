name: Windows RDP via Cloudflare

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Create Admin User
      run: |
        net user kamel007 Kamel@123 /add
        net localgroup administrators kamel007 /add

    - name: Download Cloudflared
      run: |
        Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

    - name: Start Cloudflare Tunnel
      run: |
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "access rdp --hostname localhost:3389" -NoNewWindow
        # البديل لأخذ رابط سريع TCP عبر cloudflare
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow -RedirectStandardOutput cf.log
        Start-Sleep -Seconds 10
        Get-Content cf.log | Select-String "https://.*trycloudflare.com"

        Write-Output "============================================"
        Write-Output "||      ✅ RDP READY (USE LOCAL/ALT)       ||"
        Write-Output "============================================"
        Write-Output "Username: kamel007"
        Write-Output "Password: Kamel@123"
        Write-Output "============================================"

        while ($true) { Start-Sleep -Seconds 300 }
