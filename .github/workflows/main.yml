name: Windows RDP Ready

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Set Admin Password (Built-in runneradmin)
      run: |
        $user = "runneradmin"
        $pass = "Badry2026!@#$99"
        net user $user $pass
        echo "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Start Cloudflare Tunnel (Quick TCP/QUIC)
      run: |
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow -RedirectStandardOutput cf.log -RedirectStandardError cf.err

        Write-Output "Waiting for tunnel..."
        Start-Sleep -Seconds 8

        Write-Output "============================================"
        Write-Output "||      ✅ RDP READY (CLOUDFLARE)          ||"
        Write-Output "============================================"
        Write-Output "Username: ${env:RDP_USER}"
        Write-Output "Password: ${env:RDP_PASS}"
        Write-Output "--------------------------------------------"
        Write-Output "Cloudflare Tunnel Logs:"
        Get-Content cf.err -ErrorAction SilentlyContinue
        Get-Content cf.log -ErrorAction SilentlyContinue
        Write-Output "============================================"

    - name: Keep Alive Loop
      run: |
        while ($true) {
          Start-Sleep -Seconds 60
        }

    - name: Cleanup Process
      if: always()
      run: |
        Stop-Process -Name "cloudflared" -Force -ErrorAction SilentlyContinue
