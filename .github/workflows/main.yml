name: Windows RDP via Chisel

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Set Admin Password (Built-in runneradmin)
      run: |
        $user = "runneradmin"
        $pass = "Badry2026!@#$99"
        net user $user $pass
        echo "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Download & Start Chisel Client
      run: |
        Invoke-WebRequest -Uri "https://github.com/jpillora/chisel/releases/download/v1.9.1/chisel_1.9.1_windows_amd64.gz" -OutFile chisel.gz
        expand.exe -F:* chisel.gz . 2>$null || true
        # بدلاً من تحميل خادم خارجي، استخدمنا نفق Cloudflare المعتاد أو خادم مجاني عام، لكن الأسهل العودة لـ cloudflared access أو استخدام ngrok بتوكن صحيح.
