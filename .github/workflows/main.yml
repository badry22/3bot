name: Windows RDP via Pinggy

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Create Admin User
      run: |
        net user kamel007 Kamel@123 /add
        net localgroup administrators kamel007 /add

    - name: Start Pinggy TCP Tunnel
      run: |
        Start-Process -FilePath "ssh.exe" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -R 0:localhost:3389 a.pinggy.io" -NoNewWindow -RedirectStandardOutput pinggy.log -RedirectStandardError pinggy.err
        
        $url = "جاري الاستخراج..."
        for ($i=0; $i -lt 15; $i++) {
          Start-Sleep -Seconds 2
          $content = Get-Content pinggy.err, pinggy.log -ErrorAction SilentlyContinue
          $match = $content | Select-String "tcp://([a-zA-Z0-9\.\-]+:\d+)"
          if ($match) {
            $url = $match.Matches[0].Value
            break
          }
        }

        Write-Output "============================================"
        Write-Output "||      ✅ RDP READY (PINGGY TCP)          ||"
        Write-Output "============================================"
        Write-Output "Address: $url"
        Write-Output "Username: kamel007"
        Write-Output "Password: Kamel@123"
        Write-Output "============================================"
        Write-Output "Instructions:"
        Write-Output "1. Press Win + R, type 'mstsc' and hit Enter"
        Write-Output "2. Connect to: $url"
        Write-Output "3. Use credentials above"
        Write-Output "============================================"

        while ($true) { Start-Sleep -Seconds 300 }

    - name: Cleanup Process
      if: always()
      run: |
        Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
