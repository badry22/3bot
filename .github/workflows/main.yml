name: Windows RDP via Pinggy Clean

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Set Admin Password (Built-in runneradmin)
      run: |
        $user = "runneradmin"
        $pass = "Badry2026!@#$99"
        net user $user $pass
        echo "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Start Pinggy & Show Info
      run: |
        Start-Process -FilePath "ssh.exe" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 a.pinggy.io" -NoNewWindow -RedirectStandardOutput pinggy.log -RedirectStandardError pinggy.err

        Write-Output "Waiting for tunnel establishment..."
        Start-Sleep -Seconds 8

        Write-Output "============================================"
        Write-Output "||      ✅ RDP READY (PINGGY TCP)          ||"
        Write-Output "============================================"
        Write-Output "Username: ${env:RDP_USER}"
        Write-Output "Password: ${env:RDP_PASS}"
        Write-Output "--------------------------------------------"
        Write-Output "Pinggy Logs / Address Output:"
        Get-Content pinggy.log -ErrorAction SilentlyContinue
        Get-Content pinggy.err -ErrorAction SilentlyContinue
        Write-Output "============================================"

        Write-Output "Instructions:"
        Write-Output "1. Press Win + R, type 'mstsc' and hit Enter"
        Write-Output "2. Connect using the TCP address shown in Pinggy logs above"
        Write-Output "3. Use username/password shown above"
        Write-Output "============================================"

    - name: Keep Alive Loop
      run: |
        while ($true) {
          Start-Sleep -Seconds 60
        }

    - name: Cleanup Process
      if: always()
      run: |
        Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
