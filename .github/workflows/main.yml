name: Windows RDP via Localhost.run

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Firewall
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    - name: Set Admin Password (Built-in runneradmin)
      run: |
        $user = "runneradmin"
        $pass = "Badry2026!@#$99"
        net user $user $pass
        echo "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Start Tunnel & Show Info
      run: |
        Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -R 0:localhost:3389 tunnel.localhost.run" -NoNewWindow -RedirectStandardOutput tunnel.log -RedirectStandardError tunnel.err

        Write-Output "Waiting for tunnel establishment..."
        Start-Sleep -Seconds 10

        Write-Output "============================================"
        Write-Output "||      ✅ RDP READY (LOCALHOST.RUN)       ||"
        Write-Output "============================================"
        Write-Output "Username: ${env:RDP_USER}"
        Write-Output "Password: ${env:RDP_PASS}"
        Write-Output "--------------------------------------------"
        Write-Output "Tunnel Logs / Address Output:"
        Get-Content tunnel.err -ErrorAction SilentlyContinue
        Get-Content tunnel.log -ErrorAction SilentlyContinue
        Write-Output "============================================"

        Write-Output "Instructions:"
        Write-Output "1. Press Win + R, type 'mstsc' and hit Enter"
        Write-Output "2. Connect using the TCP address shown in logs above"
        Write-Output "3. Use username/password shown above"
        Write-Output "============================================"

    - name: Keep Alive Loop
      run: |
        while ($true) {
          Start-Sleep -Seconds 60
        }

    - name: Cleanup Process
      if: always()
      run: |
        Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
